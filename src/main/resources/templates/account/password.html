<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Change Password')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main id="main" tabindex="-1" class="content" style="max-width:540px;">
        <div class="page-header">
            <h1 class="h3">Change Password</h1>
            <div class="subtitle">Use at least 8 characters that you do not use anywhere else</div>
        </div>

        <div role="alert" class="alert alert-warning" th:if="${required}">
            <i class="bi bi-key"></i>
            <strong>Your password was reset by an administrator.</strong>
            Enter the temporary password you were given, then choose your own password to continue.
        </div>
        <div role="status" class="alert alert-success" th:if="${param.changed}">
            <i class="bi bi-check-circle"></i> Your password has been changed.
            <a href="/dashboard">Go to your dashboard</a>
        </div>
        <div role="alert" class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/account/password}" method="post" class="section-card">
            <div class="mb-2">
                <label for="currentPassword" class="form-label" th:text="${required} ? 'Temporary password' : 'Current password'">Current password</label>
                <input id="currentPassword" type="password" name="currentPassword" class="form-control" required autocomplete="current-password"/>
            </div>
            <div class="mb-2">
                <label for="newPassword" class="form-label">New password</label>
                <input id="newPassword" type="password" name="newPassword" class="form-control" minlength="8" required autocomplete="new-password"/>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm new password</label>
                <input id="confirmPassword" type="password" name="confirmPassword" class="form-control" minlength="8" required autocomplete="new-password"/>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-shield-lock"></i> Change Password</button>
        </form>
    </main>
</div>
</body>
</html>

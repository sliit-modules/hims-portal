<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' · MediSure HIMS'">MediSure HIMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="/css/custom.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

<header th:fragment="navbar" class="topbar">
    <a class="skip-link" href="#main">Skip to main content</a>
    <a class="brand-mark" href="/dashboard">
        <span class="icon"><i class="bi bi-shield-plus" aria-hidden="true"></i></span>
        <span class="brand-text">MediSure HIMS</span>
    </a>
    <div class="topbar-search" sec:authorize="isAuthenticated()">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Search policies, claims, members..." aria-label="Search"/>
    </div>
    <div class="user-chip" sec:authorize="isAuthenticated()">
        <a class="icon-btn position-relative" href="/notifications"
           th:title="${unreadNotifications > 0} ? ${unreadNotifications} + ' unread notification(s)' : 'Notifications'"
           th:attr="aria-label=${unreadNotifications > 0} ? ${unreadNotifications} + ' unread notification(s)' : 'Notifications'">
            <i class="bi bi-bell" aria-hidden="true"></i>
            <span aria-hidden="true" th:if="${unreadNotifications > 0}"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  style="font-size:0.6rem;" th:text="${unreadNotifications > 9} ? '9+' : ${unreadNotifications}">1</span>
        </a>
        <div class="user-meta text-end">
            <div class="name" sec:authentication="principal.user.fullName">User</div>
            <span class="role-pill" sec:authentication="principal.user.role">ROLE</span>
        </div>
        <div class="user-avatar" sec:authentication="principal.user.initials">U</div>
        <a class="icon-btn" href="/account/password" title="Change password" aria-label="Change password"><i class="bi bi-key" aria-hidden="true"></i></a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="icon-btn" type="submit" title="Log out" aria-label="Log out"><i class="bi bi-box-arrow-right" aria-hidden="true"></i></button>
        </form>
    </div>
</header>

<nav th:fragment="sidebar" class="sidebar" aria-label="Main menu">
    <div class="side-section-label">Overview</div>
    <a class="side-link" data-path="/dashboard" href="/dashboard"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
    <a class="side-link" data-path="/profile" href="/profile"><i class="bi bi-person-vcard"></i> My Profile</a>

    <div class="side-section-label">Insurance</div>
    <a class="side-link" data-path="/plans" href="/plans" sec:authorize="hasAnyRole('ADMIN','SALES_AGENT','UNDERWRITER','POLICYHOLDER')"><i class="bi bi-clipboard2-pulse"></i> Plans</a>
    <a class="side-link" data-path="/underwriting" href="/underwriting" sec:authorize="hasAnyRole('ADMIN','UNDERWRITER','SALES_AGENT','POLICYHOLDER')"><i class="bi bi-file-earmark-medical"></i> Underwriting</a>
    <a class="side-link" data-path="/policies" href="/policies" sec:authorize="hasAnyRole('ADMIN','SALES_AGENT','POLICYHOLDER','CLAIMS_OFFICER','CRE')"><i class="bi bi-file-earmark-text"></i> Policies</a>
    <a class="side-link" data-path="/claims" href="/claims" sec:authorize="hasAnyRole('ADMIN','CLAIMS_OFFICER','POLICYHOLDER','SALES_AGENT','CRE')"><i class="bi bi-hospital"></i> Claims</a>
    <a class="side-link" data-path="/payments" href="/payments" sec:authorize="hasAnyRole('ADMIN','POLICYHOLDER','CLAIMS_OFFICER','SALES_AGENT')"><i class="bi bi-credit-card"></i> Payments</a>

    <div class="side-section-label">Support</div>
    <a class="side-link" data-path="/tickets" href="/tickets"><i class="bi bi-headset"></i> Support Tickets</a>

    <div class="side-section-label" sec:authorize="hasRole('ADMIN')">Administration</div>
    <a class="side-link" data-path="/reports" href="/reports" sec:authorize="hasRole('ADMIN')"><i class="bi bi-bar-chart-line"></i> Reports</a>
    <a class="side-link" data-path="/audit" href="/audit" sec:authorize="hasRole('ADMIN')"><i class="bi bi-clock-history"></i> Audit Log</a>
    <a class="side-link" data-path="/users" href="/users" sec:authorize="hasRole('ADMIN')"><i class="bi bi-people"></i> Manage Users</a>

    <script>
        (function () {
            var path = window.location.pathname;
            document.querySelectorAll('.side-link').forEach(function (el) {
                var p = el.getAttribute('data-path');
                if (p === '/dashboard' ? path === '/dashboard' || path === '/' : path.indexOf(p) === 0) {
                    el.classList.add('active');
                    el.setAttribute('aria-current', 'page');
                    // On small screens the menu is a scrolling strip: bring the current page into view.
                    if (el.parentElement.scrollWidth > el.parentElement.clientWidth) {
                        el.parentElement.scrollLeft = el.offsetLeft - 12;
                    }
                }
            });
        })();
    </script>
</nav>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Policies')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main id="main" tabindex="-1" class="content">
        <div class="page-header">
            <h1 class="h3">Policies</h1>
            <div class="subtitle">Issued cover across all policyholders</div>
        </div>
        <div class="table-card">
            <table class="table table-hover">
                <thead><tr><th>Policy Code</th><th>Policyholder</th><th>Plan</th><th>Premium</th><th>Status</th><th>Next Due</th><th><span class="visually-hidden">Actions</span></th></tr></thead>
                <tbody>
                <tr th:each="policy : ${policies}">
                    <td class="fw-semibold" th:text="${policy.policyCode}">POL</td>
                    <td th:text="${policy.policyholder.fullName}">Name</td>
                    <td th:text="${policy.plan.planName}">Plan</td>
                    <td th:text="'LKR ' + ${policy.premiumAmount} + ' / ' + ${policy.premiumFrequency}">0.00</td>
                    <td>
                        <span class="pill"
                              th:classappend="${policy.status.name() == 'ACTIVE' or policy.status.name() == 'RENEWED'} ? 'pill-success' : (${policy.status.name() == 'LAPSED'} ? 'pill-warning' : 'pill-danger')"
                              th:text="${policy.status}">ACTIVE</span>
                    </td>
                    <td th:text="${policy.nextDueDate}">-</td>
                    <td><a th:href="@{'/policies/' + ${policy.id}}" class="btn btn-sm btn-outline-primary">View</a></td>
                </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(policies)}" class="empty-state"><i class="bi bi-file-earmark-x"></i>No policies yet.</div>
        </div>
    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Renew / Modify Policy')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main class="content" style="max-width:600px;">
        <h3 class="mb-3">Renew / Modify <span th:text="${policy.policyCode}"></span></h3>
        <form th:action="@{'/policies/' + ${policy.id}}" method="post" class="card p-4">
            <div class="mb-2">
                <label class="form-label">New End Date (renewal)</label>
                <input type="date" name="newEndDate" class="form-control" th:value="${policy.endDate}" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Premium Billing Frequency</label>
                <select name="premiumFrequency" class="form-select" required>
                    <option th:each="f : ${frequencies}" th:value="${f}" th:selected="${f == policy.premiumFrequency}" th:text="${f}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Save Renewal</button>
            <a th:href="@{'/policies/' + ${policy.id}}" class="btn btn-link">Cancel</a>
        </form>
    </main>
</div>
</body>
</html>

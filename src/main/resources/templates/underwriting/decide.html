<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Decide Application')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main class="content" style="max-width:600px;">
        <h3 class="mb-3">Decide: <span th:text="${application.applicationCode}"></span></h3>
        <div class="card p-3 mb-3">
            <dl class="row mb-0">
                <dt class="col-sm-4">Applicant</dt><dd class="col-sm-8" th:text="${application.applicant.fullName}"></dd>
                <dt class="col-sm-4">Age</dt><dd class="col-sm-8" th:text="${application.applicantAge}"></dd>
                <dt class="col-sm-4">Pre-existing Conditions</dt><dd class="col-sm-8" th:text="${application.hasPreExistingConditions} ? 'Yes — ' + ${application.conditionsNotes} : 'No'"></dd>
                <dt class="col-sm-4">Plan Coverage Limit</dt><dd class="col-sm-8" th:text="${application.requestedPlan.coverageLimit}"></dd>
            </dl>
        </div>
        <form th:action="@{'/underwriting/' + ${application.id} + '/decide'}" method="post" class="card p-4">
            <div class="mb-2">
                <label class="form-label">Decision</label>
                <select name="decision" class="form-select" required>
                    <option value="APPROVED">Approve</option>
                    <option value="REJECTED">Reject</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">Risk Score (0-100)</label>
                <input type="number" name="riskScore" class="form-control" min="0" max="100" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Premium Loading % (0 for standard rate)</label>
                <input type="number" step="0.01" name="premiumLoadingPercent" class="form-control" min="0" value="0" required/>
            </div>
            <button type="submit" class="btn btn-primary">Submit Decision</button>
            <a th:href="@{'/underwriting/' + ${application.id}}" class="btn btn-link">Cancel</a>
        </form>
    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Plan Details')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main id="main" tabindex="-1" class="content" style="max-width:700px;">
        <div class="page-header d-flex justify-content-between align-items-start">
            <div>
                <h1 th:text="${plan.planName}" class="h3">Plan Name</h1>
                <span class="pill" th:classappend="${plan.status.name() == 'ACTIVE'} ? 'pill-success' : 'pill-neutral'" th:text="${plan.status}">ACTIVE</span>
            </div>
        </div>
        <div class="section-card mb-3">
            <p class="text-muted-soft" th:text="${plan.description}">Description</p>
            <dl class="row mb-0">
                <dt class="col-sm-4">Plan Type</dt><dd class="col-sm-8" th:text="${plan.planType}">FAMILY</dd>
                <dt class="col-sm-4">Base Premium Rate</dt><dd class="col-sm-8" th:text="'LKR ' + ${plan.premiumRate}">0.00</dd>
                <dt class="col-sm-4">Annual Coverage Limit</dt><dd class="col-sm-8" th:text="'LKR ' + ${plan.coverageLimit}">0.00</dd>
            </dl>
        </div>
        <div class="d-flex gap-2" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{'/plans/' + ${plan.id} + '/edit'}" class="btn btn-outline-primary"><i class="bi bi-pencil"></i>Edit</a>
            <form th:action="@{'/plans/' + ${plan.id} + '/delete'}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger" onclick="return confirm('Discontinue this plan?');"><i class="bi bi-slash-circle"></i>Discontinue</button>
            </form>
        </div>
        <div class="d-flex gap-2" sec:authorize="hasAnyRole('SALES_AGENT','POLICYHOLDER')">
            <a href="/underwriting/new" class="btn btn-primary"><i class="bi bi-send"></i>Apply for this Plan</a>
        </div>
    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Plan Form')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main id="main" tabindex="-1" class="content" style="max-width:600px;">
        <h1 class="h3 mb-3" th:text="${planId} ? 'Edit Plan' : 'New Insurance Plan'">Plan Form</h1>
        <form th:action="${planId} ? @{'/plans/' + ${planId}} : @{/plans}" th:object="${plan}" method="post" class="card p-4">
            <div class="mb-2">
                <label for="planName" class="form-label">Plan Name</label>
                <input type="text" th:field="*{planName}" class="form-control" required/>
                <div class="text-danger small" th:if="${#fields.hasErrors('planName')}" th:errors="*{planName}"></div>
            </div>
            <div class="mb-2">
                <label for="description" class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>
            <div class="mb-2">
                <label for="planType" class="form-label">Plan Type</label>
                <select th:field="*{planType}" class="form-select" required>
                    <option value="">Select...</option>
                    <option th:each="t : ${T(com.medisure.hims.model.PlanType).values()}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="mb-2">
                <label for="premiumRate" class="form-label">Base Premium Rate (LKR)</label>
                <input type="number" step="0.01" th:field="*{premiumRate}" class="form-control" required/>
                <div class="text-danger small" th:if="${#fields.hasErrors('premiumRate')}" th:errors="*{premiumRate}"></div>
            </div>
            <div class="mb-3">
                <label for="coverageLimit" class="form-label">Annual Coverage Limit (LKR)</label>
                <input type="number" step="0.01" th:field="*{coverageLimit}" class="form-control" required/>
                <div class="text-danger small" th:if="${#fields.hasErrors('coverageLimit')}" th:errors="*{coverageLimit}"></div>
            </div>
            <button type="submit" class="btn btn-primary">Save Plan</button>
            <a href="/plans" class="btn btn-link">Cancel</a>
        </form>
    </main>
</div>
</body>
</html>

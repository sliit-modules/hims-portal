<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Edit Profile')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main class="content" style="max-width:820px;">
        <div class="page-header">
            <h3>Edit My Profile</h3>
            <div class="subtitle">
                Your NIC is your login and cannot be changed here. Medical details help us assess
                claims faster and are only visible to you and the staff handling your cover.
            </div>
        </div>

        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/profile}" th:object="${member}" method="post">
            <div class="section-card mb-3">
                <h6><i class="bi bi-person-vcard"></i> Personal Details</h6>
                <div class="mb-2">
                    <label class="form-label">NIC <span class="text-muted-soft">(your login — cannot be changed)</span></label>
                    <input type="text" th:field="*{nic}" class="form-control" readonly/>
                </div>
                <div class="mb-2">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" required/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" th:field="*{dateOfBirth}" class="form-control" required/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Gender</label>
                        <select th:field="*{gender}" class="form-select" required>
                            <option th:each="g : ${T(com.medisure.hims.model.Gender).values()}" th:value="${g}" th:text="${g}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Marital Status</label>
                        <select th:field="*{maritalStatus}" class="form-select">
                            <option value="">Prefer not to say</option>
                            <option th:each="m : ${T(com.medisure.hims.model.MaritalStatus).values()}"
                                    th:value="${m}" th:text="${m.label}"></option>
                        </select>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Occupation</label>
                    <input type="text" th:field="*{occupation}" class="form-control" placeholder="e.g. Software Engineer"/>
                </div>
                <div class="mb-2">
                    <label class="form-label">Address</label>
                    <input type="text" th:field="*{address}" class="form-control" required/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Phone Number</label>
                        <input type="text" th:field="*{phoneNumber}" class="form-control" required/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                </div>
            </div>

            <div class="section-card mb-3">
                <h6><i class="bi bi-heart-pulse"></i> Medical Information</h6>
                <div class="row">
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Blood Group</label>
                        <select th:field="*{bloodGroup}" class="form-select" required>
                            <option th:each="b : ${T(com.medisure.hims.model.BloodGroup).values()}"
                                    th:value="${b}" th:text="${b.label}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Height (cm)</label>
                        <input type="number" th:field="*{heightCm}" class="form-control" min="30" max="260"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('heightCm')}" th:errors="*{heightCm}"></div>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Weight (kg)</label>
                        <input type="number" th:field="*{weightKg}" class="form-control" min="2" max="400"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('weightKg')}" th:errors="*{weightKg}"></div>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Allergies</label>
                    <textarea th:field="*{allergies}" class="form-control" rows="2"
                              placeholder="e.g. Penicillin, peanuts — leave blank if none"></textarea>
                </div>
                <div class="mb-2">
                    <label class="form-label">Chronic Conditions</label>
                    <textarea th:field="*{chronicConditions}" class="form-control" rows="2"
                              placeholder="e.g. Type 2 diabetes, hypertension — leave blank if none"></textarea>
                </div>
                <div class="mb-2">
                    <label class="form-label">Current Medications</label>
                    <textarea th:field="*{currentMedications}" class="form-control" rows="2"
                              placeholder="e.g. Metformin 500mg twice daily"></textarea>
                </div>
            </div>

            <div class="section-card mb-3">
                <h6><i class="bi bi-telephone-plus"></i> Emergency Contact</h6>
                <div class="row">
                    <div class="col-md-5 mb-2">
                        <label class="form-label">Contact Name</label>
                        <input type="text" th:field="*{emergencyContactName}" class="form-control"/>
                    </div>
                    <div class="col-md-3 mb-2">
                        <label class="form-label">Relationship</label>
                        <input type="text" th:field="*{emergencyContactRelation}" class="form-control" placeholder="e.g. Spouse"/>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Contact Phone</label>
                        <input type="text" th:field="*{emergencyContactPhone}" class="form-control"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('emergencyContactPhone')}" th:errors="*{emergencyContactPhone}"></div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i>Save Changes</button>
                <a href="/profile" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>

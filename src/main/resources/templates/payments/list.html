<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Payments')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main class="content">
        <div class="page-header">
            <h3>Payments</h3>
            <div class="subtitle">Premium payments across policies</div>
        </div>
        <div class="table-card">
            <table class="table table-hover">
                <thead><tr><th>Policy</th><th>Amount</th><th>Method</th><th>Billing Period</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="p : ${payments}">
                    <td class="fw-semibold" th:text="${p.policy.policyCode}">POL</td>
                    <td th:text="'LKR ' + ${p.amount}">0.00</td>
                    <td th:text="${p.method}">CARD</td>
                    <td th:text="${p.billingPeriodStart} + ' - ' + ${p.billingPeriodEnd}">-</td>
                    <td><span class="pill" th:classappend="${p.status.name() == 'PAID'} ? 'pill-success' : (${p.status.name() == 'REFUNDED'} ? 'pill-info' : 'pill-neutral')" th:text="${p.status}">PAID</span></td>
                    <td><a th:href="@{'/payments/' + ${p.id}}" class="btn btn-sm btn-outline-primary">View</a></td>
                </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(payments)}" class="empty-state"><i class="bi bi-credit-card"></i>No payments yet.</div>
        </div>
    </main>
</div>
</body>
</html>

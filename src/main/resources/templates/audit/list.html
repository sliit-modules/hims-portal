<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Audit Log')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main class="content">
        <div class="page-header">
            <h3>Audit Log</h3>
            <div class="subtitle">Every state-changing action across the system, in order</div>
        </div>
        <div class="table-card">
            <table class="table table-sm table-hover">
                <thead><tr><th>Timestamp</th><th>Entity</th><th>Action</th><th>Performed By</th><th>Notes</th></tr></thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td class="text-muted-soft" th:text="${#temporals.format(log.timestamp, 'MMM d, HH:mm:ss')}">-</td>
                    <td class="fw-semibold" th:text="${log.entityType} + ' #' + ${log.entityId}">-</td>
                    <td th:text="${log.action}">-</td>
                    <td th:text="${log.performedBy != null ? log.performedBy.fullName : 'system'}">-</td>
                    <td class="text-muted-soft" th:text="${log.notes}">-</td>
                </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(logs)}" class="empty-state"><i class="bi bi-clock-history"></i>No audit entries yet.</div>
        </div>
    </main>
</div>
</body>
</html>

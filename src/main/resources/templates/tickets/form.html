<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='New Support Ticket')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main id="main" tabindex="-1" class="content" style="max-width:600px;">
        <h1 class="h3 mb-3">Log a Support Inquiry</h1>
        <form th:action="@{/tickets}" method="post" class="card p-4">
            <div class="mb-2" th:if="${not #lists.isEmpty(policies)}">
                <label for="relatedPolicyId" class="form-label">Related Policy (optional)</label>
                <select id="relatedPolicyId" name="relatedPolicyId" class="form-select">
                    <option value="">None</option>
                    <option th:each="p : ${policies}" th:value="${p.id}" th:text="${p.policyCode}"></option>
                </select>
            </div>
            <div class="mb-2" th:if="${not #lists.isEmpty(claims)}">
                <label for="relatedClaimId" class="form-label">Related Claim (optional)</label>
                <select id="relatedClaimId" name="relatedClaimId" class="form-select">
                    <option value="">None</option>
                    <option th:each="c : ${claims}" th:value="${c.id}" th:text="${c.claimCode}"></option>
                </select>
            </div>
            <div class="mb-2">
                <label for="subject" class="form-label">Subject</label>
                <input id="subject" type="text" name="subject" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" name="message" class="form-control" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit Ticket</button>
            <a href="/tickets" class="btn btn-link">Cancel</a>
        </form>
    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Support Tickets')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main class="content">
        <div class="page-header d-flex justify-content-between align-items-end">
            <div>
                <h3>Support Tickets</h3>
                <div class="subtitle">Customer inquiries and their resolution status</div>
            </div>
            <a href="/tickets/new" class="btn btn-primary"><i class="bi bi-plus-lg"></i>New Ticket</a>
        </div>
        <div class="table-card">
            <table class="table table-hover">
                <thead><tr><th>Subject</th><th>Raised By</th><th>Related</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="t : ${tickets}">
                    <td class="fw-semibold" th:text="${t.subject}">Subject</td>
                    <td th:text="${t.raisedBy.fullName}">Name</td>
                    <td th:text="${t.relatedPolicy != null ? t.relatedPolicy.policyCode : (t.relatedClaim != null ? t.relatedClaim.claimCode : '-')}">-</td>
                    <td>
                        <span class="pill"
                              th:classappend="${t.status.name() == 'CLOSED'} ? 'pill-neutral' : (${t.status.name() == 'IN_PROGRESS'} ? 'pill-info' : 'pill-warning')"
                              th:text="${t.status}">OPEN</span>
                    </td>
                    <td><a th:href="@{'/tickets/' + ${t.id}}" class="btn btn-sm btn-outline-primary">View</a></td>
                </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(tickets)}" class="empty-state"><i class="bi bi-headset"></i>No tickets yet.</div>
        </div>
    </main>
</div>
</body>
</html>

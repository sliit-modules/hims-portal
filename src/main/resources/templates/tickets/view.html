<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Ticket Details')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="d-flex">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main class="content" style="max-width:700px;">
        <div class="page-header d-flex justify-content-between align-items-start">
            <h3 th:text="${ticket.subject}">Subject</h3>
            <span class="pill"
                  th:classappend="${ticket.status.name() == 'CLOSED'} ? 'pill-neutral' : (${ticket.status.name() == 'IN_PROGRESS'} ? 'pill-info' : 'pill-warning')"
                  th:text="${ticket.status}">OPEN</span>
        </div>
        <div class="section-card mb-3">
            <dl class="row mb-2">
                <dt class="col-sm-4">Raised By</dt><dd class="col-sm-8" th:text="${ticket.raisedBy.fullName}"></dd>
                <dt class="col-sm-4" th:if="${ticket.relatedPolicy}">Related Policy</dt><dd class="col-sm-8" th:if="${ticket.relatedPolicy}" th:text="${ticket.relatedPolicy.policyCode}"></dd>
                <dt class="col-sm-4" th:if="${ticket.relatedClaim}">Related Claim</dt><dd class="col-sm-8" th:if="${ticket.relatedClaim}" th:text="${ticket.relatedClaim.claimCode}"></dd>
                <dt class="col-sm-4">Created</dt><dd class="col-sm-8" th:text="${#temporals.format(ticket.createdAt, 'MMM d, yyyy HH:mm')}"></dd>
            </dl>
            <div class="divider"></div>
            <p class="mb-0" th:text="${ticket.message}">Message body</p>
            <div th:if="${ticket.response}" class="mt-3 p-3" style="background:var(--brand-light); border-radius:10px;">
                <strong style="font-size:0.85rem;">Response:</strong>
                <p class="mb-0" th:text="${ticket.response}"></p>
            </div>
        </div>

        <div sec:authorize="hasAnyRole('CRE','ADMIN')" th:if="${ticket.status.name() != 'CLOSED'}" class="section-card">
            <h6><i class="bi bi-reply-fill"></i> Respond</h6>
            <form th:action="@{'/tickets/' + ${ticket.id} + '/respond'}" method="post">
                <div class="mb-2">
                    <textarea name="response" class="form-control" rows="3" placeholder="Type your response..." required></textarea>
                </div>
                <div class="mb-2">
                    <select name="status" class="form-select">
                        <option value="IN_PROGRESS">Mark In Progress</option>
                        <option value="CLOSED">Close Ticket</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Send Response</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>

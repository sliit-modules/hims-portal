# Configuration for the end-to-end tests. This file replaces src/main/resources/application.yml
# while tests run, so they use a throw-away in-memory database and never touch MySQL, real
# uploads or PayHere.
spring:
  datasource:
    url: jdbc:h2:mem:hims-e2e;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: true
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

app:
  upload-dir: target/e2e-uploads

payhere:
  enabled: false

logging:
  level:
    root: WARN
    com.medisure.hims: WARN
